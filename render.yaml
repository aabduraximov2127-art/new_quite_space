databases:
  - name: quietspace-db
    plan: free
    databaseName: quietspace
    user: quietspace

services:
  - type: web
    name: quietspace-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: ./build.sh
    preDeployCommand: python manage.py migrate && python manage.py seed_places
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DATABASE_URL
        fromDatabase:
          name: quietspace-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://quietspace-frontend.onrender.com
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: gemini-flash-latest

  - type: web
    name: quietspace-frontend
    runtime: static
    plan: free
    region: frankfurt
    buildCommand: node scripts/write-config.js
    staticPublishPath: frontend
    envVars:
      - key: API_HOST
        fromService:
          name: quietspace-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
