<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2d6a4f">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/logo-icon.png">
  <title>Kirish — QuietSpace Tashkent</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/nav-animations.css">
  <link rel="stylesheet" href="css/polish.css">
</head>
<body data-page="">
  <div id="navbar"></div>

  <div class="auth-page">
    <div class="auth-card scale-in">
      <img src="assets/logo.png" alt="QuietSpace Tashkent" class="auth-logo">
      <h1 style="text-align:center">Kirish</h1>
      <p>Joy bron qilish va sevimlilar ro'yxatini saqlash uchun email va parol bilan kiring</p>
      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input class="form-input" type="email" name="email" required placeholder="email@example.com">
        </div>
        <div class="form-group">
          <label>Parol</label>
          <input class="form-input" type="password" name="password" required placeholder="••••••••">
        </div>
        <div id="loginError" class="form-error" style="display:none"></div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-top:0.5rem" id="loginBtn">Kirish</button>
      </form>
      <p style="margin-top:1rem;text-align:center;font-size:0.9rem">
        Akkaunt yo'qmi? <a href="register.html" style="color:var(--primary);font-weight:600">Ro'yxatdan o'tish</a>
      </p>
      <p style="margin-top:0.5rem;text-align:center;font-size:0.85rem;color:var(--muted)">
        Akkauntsiz ham <a href="index.html">saytni ko'rishingiz</a> mumkin
      </p>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/places-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth-modal.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/animations.js"></script>
  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const errEl = document.getElementById("loginError");
      const btn = document.getElementById("loginBtn");
      errEl.style.display = "none";
      setButtonLoading(btn, true, "Kirish");

      const result = await login(fd.get("email"), fd.get("password"));
      setButtonLoading(btn, false, "Kirish");

      if (result.ok) {
        celebrateSuccess(e.target);
        showToast(result.demo ? "Demo rejimda kirdingiz" : "Xush kelibsiz!");
        setTimeout(() => {
          location.href = sessionStorage.getItem("redirect_after_login") || "index.html";
          sessionStorage.removeItem("redirect_after_login");
        }, 500);
      } else {
        errEl.textContent = result.error;
        errEl.style.display = "block";
        shakeElement(e.target);
      }
    });
  </script>
</body>
</html>
