<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2d6a4f">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/logo-icon.png">
  <title>Ro'yxatdan o'tish — QuietSpace Tashkent</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/nav-animations.css">
  <link rel="stylesheet" href="css/polish.css">
</head>
<body data-page="">
  <div id="navbar"></div>

  <div class="auth-page">
    <div class="auth-card scale-in">
      <img src="assets/logo.png" alt="QuietSpace Tashkent" class="auth-logo">
      <h1 style="text-align:center">Ro'yxatdan o'tish</h1>
      <p>Email va parol bilan yangi akkaunt oching — keyin joylarni bron qilishingiz mumkin</p>
      <form id="registerForm">
        <div class="form-group">
          <label>Ism</label>
          <input class="form-input" type="text" name="name" required placeholder="Masalan: Aziza" minlength="2">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input class="form-input" type="email" name="email" required placeholder="email@example.com">
        </div>
        <div class="form-group">
          <label>Parol</label>
          <input class="form-input" type="password" name="password" required minlength="8" placeholder="Kamida 8 belgi">
        </div>
        <div id="registerError" class="form-error" style="display:none"></div>
        <button type="submit" class="btn btn-primary btn-lg" style="width:100%;margin-top:0.5rem" id="registerBtn">
          Ro'yxatdan o'tish
        </button>
      </form>
      <p style="margin-top:1rem;text-align:center;font-size:0.9rem">
        Akkaunt bormi? <a href="login.html" style="color:var(--primary);font-weight:600">Kirish</a>
      </p>
    </div>
  </div>

  <script src="js/places-data.js"></script>
  <script src="js/app.js"></script>
  <script src="js/auth-modal.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/animations.js"></script>
  <script>
    document.getElementById("registerForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const errEl = document.getElementById("registerError");
      const btn = document.getElementById("registerBtn");
      errEl.style.display = "none";
      setButtonLoading(btn, true, "Ro'yxatdan o'tish");

      const result = await register(fd.get("name"), fd.get("email"), fd.get("password"));
      setButtonLoading(btn, false, "Ro'yxatdan o'tish");

      if (result.ok) {
        celebrateSuccess(e.target);
        showToast(result.demo ? "Demo akkaunt yaratildi" : "Ro'yxatdan muvaffaqiyatli o'tdingiz");
        setTimeout(() => {
          location.href = sessionStorage.getItem("redirect_after_login") || "index.html";
          sessionStorage.removeItem("redirect_after_login");
        }, 500);
      } else {
        errEl.textContent = result.error;
        errEl.style.display = "block";
        shakeElement(e.target);
      }
    });
  </script>
</body>
</html>
